name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: BlinkBreak
          path: bin/BlinkBreak.exe
